name: DengueYosoku TanRabad latest-week data intake

on:
  workflow_dispatch:
  push:
    branches:
      - integration/phase9-12-final-review
    paths:
      - ".github/workflows/dengueyosoku-latest-weekly-ingest.yml"

permissions:
  contents: read

concurrency:
  group: dengueyosoku-tanrabad-weekly-intake
  cancel-in-progress: false

jobs:
  inspect:
    name: Download to ephemeral runner and inspect CSV structure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out DengueYosoku
        uses: actions/checkout@v4

      - name: Check whether the Drive file ID is configured
        id: drive_secret
        shell: bash
        env:
          DRIVE_FILE_ID: ${{ secrets.DENGUE_TANRABAD_LATEST_FILE_ID }}
        run: |
          if [[ -z "${DRIVE_FILE_ID:-}" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Drive secret is not configured. Intake will safely skip without accessing any file."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Drive source is configured."
          fi

      - name: Set up Python
        if: steps.drive_secret.outputs.available == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download latest-week TanRabad workbook or CSV to ephemeral runner storage
        if: steps.drive_secret.outputs.available == 'true'
        shell: bash
        env:
          DRIVE_FILE_ID: ${{ secrets.DENGUE_TANRABAD_LATEST_FILE_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${DRIVE_FILE_ID:-}" ]]; then
            echo "::error::Missing repository Actions secret DENGUE_TANRABAD_LATEST_FILE_ID."
            exit 1
          fi

          python -m pip install --disable-pip-version-check "gdown==6.5.2" "openpyxl==3.1.5"
          source_path="${RUNNER_TEMP}/tanrabad-latest-week-source"

          gdown --quiet --no-cookies --continue \
            "$DRIVE_FILE_ID" \
            -O "$source_path"

          if [[ ! -s "$source_path" ]]; then
            echo "::error::Google Drive download produced an empty or missing file."
            exit 1
          fi

          if head -c 1024 "$source_path" | grep -Eiq '<!doctype html|<html'; then
            echo "::error::Google Drive returned an HTML page, not a CSV. Check the sharing permission and file ID."
            exit 1
          fi

          echo "Downloaded CSV to temporary runner storage. Raw data will not be printed or uploaded."

      - name: Inspect schema without printing patient records
        if: steps.drive_secret.outputs.available == 'true'
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/tanrabad-latest-week-source" "$RUNNER_TEMP/tanrabad-weekly-structure-audit.json" <<'PY'
          import csv
          import hashlib
          import json
          import re
          import sys
          import zipfile
          from pathlib import Path

          source = Path(sys.argv[1])
          destination = Path(sys.argv[2])

          def normalize(value):
              return re.sub(r"[^a-z0-9ก-๙]", "", str(value or "").lower())

          identifier_exact = {
              "hn", "cid", "pid", "an", "vn", "patientid", "patientnumber",
              "personid", "personnumber", "citizenid", "nationalid", "idcard",
              "passport", "firstname", "lastname", "patientname", "fullname",
              "telephone", "phonenumber", "mobile", "email", "dob", "dateofbirth",
              "birthdate", "เลขบัตรประชาชน", "เลขประจำตัวประชาชน", "เลขที่บัตร",
              "เลขโรงพยาบาล", "หมายเลขผู้ป่วย", "ชื่อผู้ป่วย", "ชื่อ", "นามสกุล",
              "ชื่อจริง", "ชื่อสกุล", "ชื่อและนามสกุล", "เบอร์โทร",
              "หมายเลขโทรศัพท์", "ที่อยู่", "บ้านเลขที่",
          }
          identifier_fragments = (
              "hospitalnumber", "patientid", "personid", "citizenid",
              "nationalid", "idcard", "passport", "firstname", "lastname",
              "patientname", "fullname", "telephone", "phonenumber",
              "email", "dateofbirth", "birthdate", "เลขบัตรประชาชน",
              "เลขประจำตัวประชาชน", "เลขโรงพยาบาล", "หมายเลขผู้ป่วย",
              "ชื่อผู้ป่วย", "นามสกุล", "ชื่อจริง", "ชื่อสกุล",
              "ชื่อและนามสกุล", "เบอร์โทร", "หมายเลขโทรศัพท์", "บ้านเลขที่",
          )

          def classify_headers(headers):
              normalized = {h: normalize(h) for h in headers}
              province = [h for h, n in normalized.items()
                          if any(t in n for t in ("province", "changwat", "จังหวัด"))]
              week = [h for h, n in normalized.items()
                      if any(t in n for t in ("date", "week", "epiweek", "year", "วันที่", "สัปดาห์", "ปี"))]
              cases = [h for h, n in normalized.items()
                       if any(t in n for t in ("case", "count", "patient", "ผู้ป่วย", "จำนวน"))]
              identifiers = [
                  h for h, n in normalized.items()
                  if n in identifier_exact or any(t in n for t in identifier_fragments)
              ]
              return province, week, cases, identifiers

          def file_sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def summarize_csv(path):
              with path.open("rb") as raw:
                  sample_bytes = raw.read(8192)
              encoding = None
              for candidate in ("utf-8-sig", "utf-16", "utf-32", "utf-16-le",
                                "utf-16-be", "cp874", "tis-620"):
                  try:
                      sample_bytes.decode(candidate)
                      encoding = candidate
                      break
                  except (UnicodeDecodeError, LookupError):
                      continue
              if encoding is None:
                  from charset_normalizer import from_bytes
                  detected = from_bytes(sample_bytes).best()
                  if detected is not None:
                      try:
                          sample_bytes.decode(detected.encoding)
                          encoding = detected.encoding
                      except (UnicodeDecodeError, LookupError):
                          pass
              if encoding is None:
                  raise SystemExit("CSV encoding is not recognized; manual review is required.")

              with path.open("r", encoding=encoding, newline="") as handle:
                  sample = handle.read(8192)
                  handle.seek(0)
                  try:
                      dialect = csv.Sniffer().sniff(sample, delimiters=",;\t|")
                  except csv.Error:
                      dialect = csv.excel
                  reader = csv.DictReader(handle, dialect=dialect)
                  headers = reader.fieldnames or []
                  if not headers or not any((h or "").strip() for h in headers):
                      raise SystemExit("CSV has no readable header row.")
                  province_cols, week_cols, case_cols, identifiers = classify_headers(headers)
                  province_values = set()
                  row_count = 0
                  for row in reader:
                      if not any(str(v or "").strip() for v in row.values()):
                          continue
                      row_count += 1
                      if province_cols:
                          value = str(row.get(province_cols[0]) or "").strip()
                          if value:
                              province_values.add(value)
              return {
                  "sheet_name": None,
                  "header_row": 1,
                  "column_count": len(headers),
                  "columns": headers,
                  "row_count": row_count,
                  "province_column_candidates": province_cols,
                  "distinct_province_count": len(province_values) if province_cols else None,
                  "week_or_date_column_candidates": week_cols,
                  "case_count_column_candidates": case_cols,
                  "possible_direct_identifier_columns": identifiers,
                  "encoding": encoding,
              }

          def summarize_xlsx(path):
              from openpyxl import load_workbook
              workbook = load_workbook(path, read_only=True, data_only=True)
              summaries = []
              try:
                  for worksheet in workbook.worksheets:
                      limit = min(max(worksheet.max_row or 20, 1), 30)
                      preview = list(worksheet.iter_rows(min_row=1, max_row=limit, values_only=True))
                      best = None
                      best_score = -1
                      for row_index, row in enumerate(preview, start=1):
                          values = [str(v).strip() if v is not None else "" for v in row]
                          headers_candidate = [v for v in values if v]
                          if len(headers_candidate) < 2:
                              continue
                          province, week, cases, identifiers = classify_headers(headers_candidate)
                          score = (3 * bool(province)) + (2 * bool(week)) + (2 * bool(cases))
                          if score > best_score:
                              best = (row_index, values, province, week, cases, identifiers)
                              best_score = score
                      if best is None:
                          summaries.append({
                              "sheet_name": worksheet.title,
                              "header_detected": False,
                              "column_count": 0,
                              "columns": [],
                              "row_count": 0,
                              "province_column_candidates": [],
                              "distinct_province_count": None,
                              "week_or_date_column_candidates": [],
                              "case_count_column_candidates": [],
                              "possible_direct_identifier_columns": [],
                          })
                          continue

                      header_row, header_values, province_cols, week_cols, case_cols, identifiers = best
                      headers = [v for v in header_values if v]
                      province_index = next(
                          (i for i, value in enumerate(header_values) if value and value in province_cols), None
                      )
                      row_count = 0
                      province_values = set()
                      for row in worksheet.iter_rows(min_row=header_row + 1, values_only=True):
                          if not any(v is not None and str(v).strip() for v in row):
                              continue
                          row_count += 1
                          if province_index is not None and province_index < len(row):
                              value = row[province_index]
                              if value is not None and str(value).strip():
                                  province_values.add(str(value).strip())
                      summaries.append({
                          "sheet_name": worksheet.title,
                          "header_detected": True,
                          "header_row": header_row,
                          "column_count": len(headers),
                          "columns": headers,
                          "row_count": row_count,
                          "province_column_candidates": province_cols,
                          "distinct_province_count": len(province_values) if province_cols else None,
                          "week_or_date_column_candidates": week_cols,
                          "case_count_column_candidates": case_cols,
                          "possible_direct_identifier_columns": identifiers,
                      })
              finally:
                  workbook.close()
              return summaries

          if not source.is_file() or source.stat().st_size < 100:
              raise SystemExit("Downloaded source file is missing or unexpectedly small.")

          if zipfile.is_zipfile(source):
              with zipfile.ZipFile(source) as archive:
                  archive_entries = [
                      name for name in archive.namelist()
                      if name and not name.endswith("/")
                  ]
              if "[Content_Types].xml" not in archive_entries:
                  import gzip
                  import io
                  member_reports = []
                  all_identifiers = set()
                  total_rows = 0
                  with zipfile.ZipFile(source) as archive:
                      csv_entries = [
                          name for name in archive.namelist()
                          if name and not name.endswith("/") and name.lower().endswith(".csv")
                      ]
                      for member_name in csv_entries:
                          raw_bytes = archive.read(member_name)
                          encoding = None
                          for candidate in ("utf-8-sig", "utf-16", "utf-32", "cp874", "tis-620"):
                              try:
                                  raw_bytes[:8192].decode(candidate)
                                  encoding = candidate
                                  break
                              except (UnicodeDecodeError, LookupError):
                                  continue
                          if encoding is None:
                              from charset_normalizer import from_bytes
                              detected = from_bytes(raw_bytes[:8192]).best()
                              if detected is not None:
                                  try:
                                      raw_bytes[:8192].decode(detected.encoding)
                                      encoding = detected.encoding
                                  except (UnicodeDecodeError, LookupError):
                                      pass
                          if encoding is None:
                              member_reports.append({
                                  "file_name": member_name,
                                  "status": "unsupported_encoding",
                                  "row_count": None,
                                  "column_count": None,
                                  "columns": [],
                                  "province_column_candidates": [],
                                  "distinct_province_count": None,
                                  "week_or_date_column_candidates": [],
                                  "case_count_column_candidates": [],
                                  "possible_direct_identifier_columns": [],
                              })
                              continue

                          text_data = raw_bytes.decode(encoding)
                          try:
                              dialect = csv.Sniffer().sniff(text_data[:8192], delimiters=",;\t|")
                          except csv.Error:
                              dialect = csv.excel
                          preview_reader = csv.reader(io.StringIO(text_data), dialect=dialect)
                          preview_rows = []
                          for _ in range(30):
                              try:
                                  preview_rows.append(next(preview_reader))
                              except StopIteration:
                                  break

                          best = None
                          best_score = -1
                          for row_index, row in enumerate(preview_rows):
                              headers_candidate = [str(value or "").strip() for value in row]
                              nonempty = [value for value in headers_candidate if value]
                              if len(nonempty) < 2:
                                  continue
                              province, week, cases, identifiers = classify_headers(nonempty)
                              score = (5 * bool(province)) + (3 * bool(week)) + (3 * bool(cases)) + min(len(nonempty), 12)
                              if score > best_score:
                                  best = (row_index, headers_candidate, province, week, cases, identifiers)
                                  best_score = score

                          if best is None:
                              member_reports.append({
                                  "file_name": member_name,
                                  "status": "header_not_detected",
                                  "row_count": None,
                                  "column_count": 0,
                                  "columns": [],
                                  "province_column_candidates": [],
                                  "distinct_province_count": None,
                                  "week_or_date_column_candidates": [],
                                  "case_count_column_candidates": [],
                                  "possible_direct_identifier_columns": [],
                              })
                              continue

                          header_index, headers, province_cols, week_cols, case_cols, identifiers = best
                          province_index = next(
                              (i for i, value in enumerate(headers) if value and value in province_cols),
                              None
                          )
                          data_reader = csv.reader(io.StringIO(text_data), dialect=dialect)
                          for _ in range(header_index + 1):
                              try:
                                  next(data_reader)
                              except StopIteration:
                                  break

                          row_count = 0
                          province_values = set()
                          for row in data_reader:
                              if not any(str(value or "").strip() for value in row):
                                  continue
                              row_count += 1
                              if province_index is not None and province_index < len(row):
                                  value = str(row[province_index] or "").strip()
                                  if value:
                                      province_values.add(value)

                          total_rows += row_count
                          all_identifiers.update(identifiers)
                          member_reports.append({
                              "file_name": member_name,
                              "status": "inspected",
                              "encoding": encoding,
                              "header_row": header_index + 1,
                              "row_count": row_count,
                              "column_count": len(headers),
                              "columns": headers,
                              "province_column_candidates": province_cols,
                              "distinct_province_count": len(province_values) if province_cols else None,
                              "week_or_date_column_candidates": week_cols,
                              "case_count_column_candidates": case_cols,
                              "possible_direct_identifier_columns": identifiers,
                          })

                  report = {
                      "file_name": source.name,
                      "file_format": "zip_of_csv",
                      "file_size_bytes": source.stat().st_size,
                      "sha256": file_sha256(source),
                      "archive_entry_count": len(archive_entries),
                      "csv_file_count": len(csv_entries),
                      "total_data_rows": total_rows,
                      "files": member_reports,
                      "possible_direct_identifier_columns": sorted(all_identifiers),
                      "raw_records_included": False,
                      "raw_records_extracted_to_artifact": False,
                      "status": (
                          "blocked_pending_privacy_review" if all_identifiers
                          else "structure_only_review" if csv_entries and all(x.get("status") == "inspected" for x in member_reports)
                          else "partial_structure_review"
                      ),
                  }
                  destination.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
                  print(f"ZIP source inspected: {len(archive_entries)} entries, {len(csv_entries)} CSV files, {total_rows:,} data rows.")
                  print("Only headers, row counts and province counts were inspected; raw record values were not printed or uploaded.")
                  if all_identifiers:
                      print("Potential direct-identifier columns detected; stop before modeling.")
                      raise SystemExit(2)
                  if not csv_entries or any(x.get("status") != "inspected" for x in member_reports):
                      print("One or more archive CSV files need manual format review.")
                      raise SystemExit(3)
                  raise SystemExit(0)
              import shutil
              file_format = "xlsx_or_ooxml"
              workbook_path = source.with_name(source.name + ".xlsx")
              shutil.copyfile(source, workbook_path)
              sheet_reports = summarize_xlsx(workbook_path)
              workbook_path.unlink(missing_ok=True)
              if not sheet_reports:
                  raise SystemExit("Workbook has no readable worksheets.")
              all_identifiers = sorted({
                  column for sheet in sheet_reports
                  for column in sheet.get("possible_direct_identifier_columns", [])
              })
              total_rows = sum(sheet.get("row_count", 0) for sheet in sheet_reports)
              total_columns = sum(sheet.get("column_count", 0) for sheet in sheet_reports)
              report = {
                  "file_name": source.name,
                  "file_format": file_format,
                  "file_size_bytes": source.stat().st_size,
                  "sha256": file_sha256(source),
                  "sheet_count": len(sheet_reports),
                  "total_data_rows": total_rows,
                  "total_columns_across_sheets": total_columns,
                  "sheets": sheet_reports,
                  "possible_direct_identifier_columns": all_identifiers,
                  "raw_records_included": False,
                  "status": "blocked_pending_privacy_review" if all_identifiers else "structure_only_review",
              }
          else:
              with source.open("rb") as raw:
                  signature = raw.read(8)
              if signature.startswith(bytes.fromhex("D0CF11E0A1B11AE1")):
                  raise SystemExit("Legacy XLS workbook detected; this intake reader requires XLSX or CSV.")
              sheet = summarize_csv(source)
              report = {
                  "file_name": source.name,
                  "file_format": "csv",
                  "file_size_bytes": source.stat().st_size,
                  "sha256": file_sha256(source),
                  "sheet_count": 1,
                  "total_data_rows": sheet["row_count"],
                  "total_columns_across_sheets": sheet["column_count"],
                  "sheets": [sheet],
                  "possible_direct_identifier_columns": sheet["possible_direct_identifier_columns"],
                  "raw_records_included": False,
                  "status": "blocked_pending_privacy_review" if sheet["possible_direct_identifier_columns"] else "structure_only_review",
              }

          destination.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"Source structure inspected: format={report['file_format']}, rows={report['total_data_rows']:,}, sheets={report['sheet_count']}.")
          for sheet in report["sheets"]:
              count = sheet.get("distinct_province_count")
              print(f"Sheet={sheet.get('sheet_name') or 'CSV'}; columns={sheet['column_count']}; provinces={count if count is not None else 'not detected'}.")
          print("Raw patient records and sample rows were not printed or exported.")
          if report["possible_direct_identifier_columns"]:
              print("Potential direct-identifier columns detected; stop before modeling.")
              raise SystemExit(2)
          PY
      - name: Upload structure-only audit report
        if: ${{ always() && steps.drive_secret.outputs.available == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dengueyosoku-tanrabad-weekly-structure-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/tanrabad-weekly-structure-audit.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Confirm intake is ready for model-specific mapping
        if: ${{ success() && steps.drive_secret.outputs.available == 'true' }}
        run: echo "Structure-only intake audit completed. No training, prediction, deployment, or raw-data publication was performed."

# Re-trigger intake after the repository Drive secret was configured (2026-11-21).

# Re-run ZIP-contained regional CSV structure inspection after parser update.
