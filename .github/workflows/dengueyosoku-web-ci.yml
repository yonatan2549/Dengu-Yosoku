name: DengueYosoku web CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/dengueguard-improvements
      - feature/local-ollama-health-rag-2026-11-21
      - feature/health-assistant-sqlite-rag-modern-ui
      - integration/phase9-12-final-review
      - review/national-alerts-independent-audit-2026-11-21
    paths:
      - "dengueguard-vercel/**"
      - ".github/workflows/dengueyosoku-web-ci.yml"
  pull_request:
    branches:
      - main
      - feature/dengueguard-improvements
      - feature/local-ollama-health-rag-2026-11-21
      - feature/health-assistant-sqlite-rag-modern-ui
      - integration/phase9-12-final-review
      - review/national-alerts-independent-audit-2026-11-21
    paths:
      - "dengueguard-vercel/**"
      - ".github/workflows/dengueyosoku-web-ci.yml"

permissions:
  contents: read

concurrency:
  group: dengueyosoku-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate website, application regression and model adapter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dengueguard-vercel
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile model adapter and weekly history bridge scripts
        run: python -m py_compile scripts/fetch_model_outputs.py scripts/convert_model_outputs.py scripts/build_tanrabad_current_model_inputs.py scripts/test_build_tanrabad_current_model_inputs.py scripts/merge_model_snapshot_history.py scripts/test_merge_model_snapshot_history.py scripts/prepare_current_model_snapshot.py scripts/test_prepare_current_model_snapshot.py


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dengueguard-vercel/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Historical 77-province snapshot builder tests
        run: npm run test:province-history

      - name: TypeScript check
        run: npm run typecheck
      - name: Dashboard dataset selection regression
        working-directory: dengueguard-vercel
        run: npm run test:dashboard-view

      - name: Epidemiological week label regression
        working-directory: dengueguard-vercel
        run: npm run test:dashboard-view

      - name: Alert dry-run engine tests
        run: npm run test:alerts

      - name: Alert lifecycle contract tests
        run: npm run test:alert-lifecycle

      - name: Alert workflow and model gate regression tests
        run: npm run test:alert-workflows

      - name: Alert migration hardening contract tests
        run: npm run test:alert-migration-hardening

      - name: Assessment engine tests
        run: npm run test:assessment





      - name: Model validation tests
        run: npm run test:model-validation


      - name: Alert freshness tests
        run: npm run test:alert-freshness

      - name: Model server loader tests
        run: npm run test:model-loader

      - name: Model performance tests
        run: npm run test:model-performance

      - name: Model operations tests
        run: npm run test:model-operations

      - name: Health knowledge tests
        run: npm run test:health-knowledge

      - name: Model release integrity tests
        run: npm run test:model-release-integrity

      - name: Health Assistant evidence tests
        run: npm run test:health-evidence

      - name: Health Assistant chat tests
        run: npm run test:health-assistant-chat

      - name: Health Assistant request body size tests
        run: npm run test:health-assistant-request-body

      - name: Model temporal monitor tests
        run: npm run test:model-temporal-monitor

      - name: Health knowledge governance tests
        run: npm run test:health-knowledge-governance

      - name: Model refresh observability tests
        run: npm run test:model-refresh-observability

      - name: Model snapshot consistency tests
        run: npm run test:model-snapshot-consistency

      - name: Model consumer readiness tests
        run: npm run test:model-consumer-readiness

      - name: Health Assistant source policy tests
        run: npm run test:health-assistant-source-policy

      - name: Health knowledge RAG tests
        run: npm run test:health-knowledge-rag

      - name: Local Ollama Health RAG contract tests
        run: npm run test:local-health-rag

      - name: Local SQLite RAG public evidence contract tests
        run: npm run test:health-assistant-sqlite-rag


      - name: Snapshot actual-history bridge and MMWR contract tests
        run: |
          python -m unittest scripts.test_merge_model_snapshot_history -v
          python -m unittest scripts.test_build_tanrabad_current_model_inputs -v

      - name: Python model artifact and release regression tests
        run: |
          npm run test:model-artifact-pipeline
          npm run test:model-source-probe
          npm run test:model-release-guard
          npm run test:model-release-inspection
          python scripts/build_alert_threshold_draft.py --check
          python -m unittest scripts.test_alert_threshold_draft -v
          python -m unittest scripts.test_classic_function_parity -v
          python -m unittest scripts.test_build_tanrabad_current_model_inputs -v
          python -m unittest scripts.test_prepare_current_model_snapshot -v

      - name: Model release source guard
        run: npm run check:model-release-guard
      - name: Production build
        run: npm run build

      - name: Built application route and safety smoke tests
        run: npm run test:built-app-smoke
