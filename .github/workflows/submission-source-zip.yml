name: DengueYosoku submission source ZIP

on:
  push:
    branches:
      - integration/phase9-12-final-review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-source:
    name: Package clean web application source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Create submission ZIP and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --prefix=DengueYosoku/ HEAD dengueguard-vercel > dist/DengueYosoku-Source.zip
          sha256sum dist/DengueYosoku-Source.zip > dist/SHA256SUMS.txt
          printf 'Source commit: %s\n' "${GITHUB_SHA}" > dist/SOURCE_COMMIT.txt
          printf 'Included path: dengueguard-vercel/\n' >> dist/SOURCE_COMMIT.txt
          printf 'Generated at: %s\n' "${GITHUB_RUN_ID}" >> dist/SOURCE_COMMIT.txt
          unzip -t dist/DengueYosoku-Source.zip

      - name: Upload submission archive
        uses: actions/upload-artifact@v4
        with:
          name: DengueYosoku-Submission-${{ github.sha }}
          path: |
            dist/DengueYosoku-Source.zip
            dist/SHA256SUMS.txt
            dist/SOURCE_COMMIT.txt
          if-no-files-found: error
          retention-days: 7
